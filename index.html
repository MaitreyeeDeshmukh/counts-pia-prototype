<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#1E1B2B; --soft:#5E5A6B; --line:#D9D9D2;
  --maroon:#8C1D40; --gold:#FFC627; --goldInk:#6B4E00; --sage:#E3E8DF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17151F; --card:#221F2D; --ink:#F1EFF5; --soft:#ABA6B8; --line:#383446;
    --maroon:#E0668C; --gold:#FFC627; --goldInk:#FFD866; --sage:#2A2D2A;
  }
}
:root[data-theme="dark"]{
  --paper:#17151F; --card:#221F2D; --ink:#F1EFF5; --soft:#ABA6B8; --line:#383446;
  --maroon:#E0668C; --gold:#FFC627; --goldInk:#FFD866; --sage:#2A2D2A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:44px;font-weight:800;letter-spacing:-.02em}
h2{font-size:28px;font-weight:700;letter-spacing:-.01em}
h3{font-size:19px;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--soft)}
.small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;display:flex;gap:10px;align-items:center}
.tallyLogo{display:inline-flex;gap:3px;position:relative;height:22px;align-items:stretch}
.tallyLogo i{width:3px;background:var(--maroon);border-radius:2px}
.tallyLogo::after{content:"";position:absolute;left:-3px;right:-3px;top:9px;height:3px;background:var(--gold);transform:rotate(-24deg);border-radius:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.hero{background:var(--maroon);color:#fff;border:none;border-radius:22px;padding:22px}
.hero .muted{color:#F3D9E1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:13px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.gold{background:var(--gold);color:#2A2000}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:block;font-weight:700;margin:14px 0 6px}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px}
textarea{min-height:120px;resize:vertical}
.prompt{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.15;margin:8px 0 14px}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--gold);color:#2A2000;cursor:pointer;display:grid;place-items:center;margin:8px auto}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,198,39,.6)}100%{box-shadow:0 0 0 22px rgba(255,198,39,0)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none;outline:4px solid var(--gold)}}
.pair{display:grid;gap:10px}
.said{border-left:4px solid var(--gold);padding:10px 14px;background:var(--sage);border-radius:0 12px 12px 0;font-style:italic}
.skillTag{display:inline-block;background:var(--maroon);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;margin:0 6px 6px 0}
.skillTag.gap{background:transparent;color:var(--maroon);border:1.5px dashed var(--maroon)}
.tallyRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tallyRow:last-child{border-bottom:none}
.tallies{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.group{display:inline-flex;gap:3px;position:relative;height:20px}
.group i{width:3px;background:var(--ink);border-radius:2px}
.group.full::after{content:"";position:absolute;left:-3px;right:-3px;top:8px;height:3px;background:var(--gold);transform:rotate(-24deg);border-radius:2px}
.story{padding:14px 0;border-bottom:1px solid var(--line)}
.story:last-child{border-bottom:none}
.src{font-size:13px;font-weight:700;color:var(--goldInk)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:none;padding:12px 4px;font-weight:700;font-size:14px;color:var(--soft);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--maroon)}
.tabs button[aria-current="page"]::before{content:"";display:block;height:3px;width:28px;margin:-12px auto 9px;background:var(--gold);border-radius:2px}
.notice{font-size:14px;background:var(--sage);border-radius:12px;padding:10px 12px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--maroon);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.qa{padding:12px 0;border-bottom:1px solid var(--line)}
.choice{display:flex;gap:8px;margin-top:8px}
.choice button{flex:1}
.choice button[aria-pressed="true"]{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.linkBox{word-break:break-all;font-size:14px;background:var(--paper);border:1.5px dashed var(--line);padding:10px;border-radius:10px}
.manager{background:var(--card);border:2px solid var(--maroon);border-radius:18px;padding:18px}
.resumeLine{font-weight:700}
.empty{text-align:center;padding:26px 10px}
.tabs nav{grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:13px}
.res{padding:14px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:none}
.res a{color:var(--maroon);font-weight:700}
.who{font-size:13px;color:var(--soft)}
.bar{height:12px;background:var(--sage);border-radius:6px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--maroon);border-radius:6px}
.bar.gold span{background:var(--gold)}
.metric{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--paper);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px}
.pushcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 24px rgba(30,27,43,.18);cursor:pointer;text-align:left;width:100%}
.pushicon{width:36px;height:36px;border-radius:9px;background:var(--maroon);flex:none;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.peer{margin-top:8px;font-size:14px;background:var(--paper);border-radius:10px;padding:8px 12px}
.toggle{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.toggle input{width:auto;margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%}
.seg button[aria-pressed="true"]{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.switch{font-size:14px;background:none;border:none;color:var(--maroon);font-weight:700;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<div class="tabs"><nav id="tabs" aria-label="Main"></nav></div>
<script>
(function(){
const KEY="counts.v3";
const SKILLS=["Communication","Problem solving","Conflict resolution","Teamwork","Leadership","Time management","Customer service","Attention to detail","Adaptability","Training others","Technical skills","Responsibility"];
const FIELD_NEEDS={
  "Engineering":["Problem solving","Technical skills","Teamwork","Attention to detail","Communication"],
  "Business":["Communication","Leadership","Customer service","Problem solving","Time management"],
  "Healthcare":["Communication","Attention to detail","Responsibility","Adaptability","Teamwork"],
  "Education":["Communication","Training others","Adaptability","Leadership","Conflict resolution"],
  "Tech and software":["Technical skills","Problem solving","Teamwork","Adaptability","Communication"],
  "Sustainability and policy":["Communication","Problem solving","Teamwork","Leadership","Adaptability"],
  "Not sure yet":["Communication","Problem solving","Teamwork","Responsibility","Adaptability"]
};
// Resources checked against ASU web pages, Sept 2026. requires: "campus" = ASU student employees only.
const RESOURCES=[
  {id:"cds",name:"Career Development Specialist appointment",org:"ASU Career Services",who:"All ASU students",what:"One-on-one help with your resume and internship search.",skills:["Communication","Leadership","Problem solving","Customer service"],url:"https://career.eoss.asu.edu/channels/resume-application-materials/"},
  {id:"sdcp",name:"Sun Devil Career Prep",org:"ASU Career Services",who:"All ASU students",what:"AI tool for resume help and practice interviews.",skills:["Communication","Conflict resolution"],url:"https://career.eoss.asu.edu/channels/ai/"},
  {id:"careerlink",name:"ASU CareerLink",org:"ASU Career Services",who:"All ASU students",what:"Find jobs, internships and career events to build experience.",skills:["Customer service","Responsibility","Teamwork","Time management"],url:"https://career.eoss.asu.edu/resources/handshake/"},
  {id:"lil",name:"LinkedIn Learning",org:"Work+",who:"ASU student employees on ASU payroll",what:"Free courses on tools and workplace skills.",skills:["Technical skills","Time management","Attention to detail","Leadership"],url:"https://workplus.asu.edu/resources-students",requires:"campus"},
  {id:"workplus",name:"Work+ Student Employee Hub",org:"Work+",who:"ASU student employees",what:"Career competency training and events for working learners.",skills:["Leadership","Teamwork","Adaptability","Training others"],url:"https://workplus.asu.edu/resources-students",requires:"campus"},
  {id:"orgs",name:"Student organizations",org:"Sun Devil Central",who:"All ASU students",what:"Take a role in a club or team project.",skills:["Teamwork","Leadership","Conflict resolution","Training others","Adaptability"],url:null},
  {id:"changemaker",name:"Changemaker Central",org:"ASU",who:"All ASU students",what:"Community service and social impact projects you can join or lead.",skills:["Leadership","Responsibility","Adaptability","Teamwork"],url:null}
];
const CLASS_PROMPTS=["What was the hardest part of a class, lab, or project this week?","You worked in a group. What did you do when it got stuck?","What did you explain to a classmate, or figure out on your own?","What did you learn in class that you could use outside it?","What part of an assignment are you proud of? What exactly did you do?","What did you have to redo or fix, and how?"];
const PROMPTS=["What was the hardest moment of this shift?","Did anyone need help today that only you could give?","What went wrong, and what did you do about it?","What did you do today that a new hire couldn't?","Who did you have to calm down, convince, or explain something to?","What did you juggle today?"];
const UNPAID=[
  {id:"care",q:"Do you take care of someone? A sibling, parent, grandparent.",hint:"What does a normal week of that look like?"},
  {id:"translate",q:"Do you translate or handle paperwork for your family?",hint:"Think forms, doctor visits, phone calls, school meetings."},
  {id:"shop",q:"Do you help with a family business?",hint:"The register, inventory, orders, customers."},
  {id:"community",q:"Do you volunteer or help run anything? A club, team, place of worship, community group.",hint:"What are you trusted with?"},
  {id:"school",q:"Did you have a job or big responsibility in high school?",hint:"A part time job, team captain, running an event."}
];
const QUESTIONS=[
  {q:"Tell me about a time you dealt with a difficult person.",skill:"Conflict resolution"},
  {q:"Tell me about a time you solved a problem on the spot.",skill:"Problem solving"},
  {q:"Describe a time you worked with a team to get something done.",skill:"Teamwork"},
  {q:"Tell me about a time you had to juggle a lot at once.",skill:"Time management"},
  {q:"Tell me about a time you took the lead.",skill:"Leadership"},
  {q:"Tell me about a time plans changed at the last minute.",skill:"Adaptability"},
  {q:"Tell me about a time you taught someone something.",skill:"Training others"},
  {q:"Tell me about a time someone depended on you.",skill:"Responsibility"}
];

let state=load();
let view=state.profile?"home":"welcome";
let tmp={};
let sampleFn=null;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.stories)){s.visits=s.visits||{};return s;}}catch(e){}return{profile:null,stories:[],visits:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return Math.random().toString(36).slice(2,10);}
function todayPrompt(m){const L=(m||"shift")==="class"?CLASS_PROMPTS:PROMPTS;const d=new Date();return L[(d.getDate()+state.stories.length)%L.length];}
function majorLabel(){const p=state.profile||{};return p.major||p.field||"your major";}
function fmtDate(t){return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function works(){return state.profile&&state.profile.work!=="none";}
function eligible(r){return !r.requires||(state.profile&&state.profile.work==="campus");}

if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{sampleFn=s;}).catch(()=>{});}

const RULES=[
  [/(angry|upset|yell|complain|calm|argu)/i,"Conflict resolution"],
  [/(customer|guest|patron|client|visitor)/i,"Customer service"],
  [/(explain|told|convinc|talk|call|email|translat)/i,"Communication"],
  [/(fix|figur|solv|broke|problem|wrong|issue|jam)/i,"Problem solving"],
  [/(train|showed (her|him|them)|new hire|taught|teach)/i,"Training others"],
  [/(team|cowork|together|covered|shift lead|group|partner)/i,"Teamwork"],
  [/(rush|busy|juggl|same time|deadline|multiple)/i,"Time management"],
  [/(count|check|inventory|cash|register|accura|detail|form)/i,"Attention to detail"],
  [/(changed|last minute|short.?staffed|instead|adapt|called out)/i,"Adaptability"],
  [/(led|lead|in charge|decid|organiz|captain)/i,"Leadership"],
  [/(software|system|computer|excel|code|machine|pos|printer|lab|pipette|data|analy)/i,"Technical skills"],
  [/(open|clos|trusted|responsib|keys|alone|take care|bills)/i,"Responsibility"]
];
const COMMON=new Set("about actually already another anything because been before being better between called classes coming complete completely consider could couldn customer customers decided details different doing during either enough especially even every everyone everything explain explained figure figured finally finished first following friend getting going group happened having helped helping himself however instead into itself little looked making manager managers maybe might morning mostly myself needed never nothing number often other others people person pretty probably problem problems really right same section semester should shouldn showed since someone something sometimes started still students supposed sure their themselves there they thing things think though through together tomorrow tonight took toward trying turned until using usually wanted watched week weekend weren what when where whether which while whole without working would wouldn yesterday your".split(" "));
function findTerms(text){
  const out=[];
  (text.match(/\b[A-Za-z][A-Za-z0-9-]*\b/g)||[]).forEach(w=>{
    const low=w.toLowerCase();
    const acronym=/^[A-Z0-9]{2,6}$/.test(w)&&!["I","A","OK","AM","PM","TV"].includes(w);
    const longword=low.length>=9&&!COMMON.has(low)&&/^[a-z][a-z-]+$/.test(low);
    if((acronym||longword)&&!out.some(t=>t.toLowerCase()===low)&&out.length<4)out.push(acronym?w:low);
  });
  return out;
}
function fallbackTranslate(text){
  const sentences=text.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
  const found=[];
  for(const [re,name] of RULES){
    if(found.length>=3)break;
    const hit=sentences.find(s=>re.test(s));
    if(hit&&!found.some(f=>f.name===name))found.push({name,quote:hit.length>140?hit.slice(0,137)+"...":hit});
  }
  const terms=findTerms(text);
  if(!found.length)found.push({name:terms.length?"Technical skills":"Responsibility",quote:sentences[0]||text});
  const first=(sentences[0]||text).replace(/^i /i,"").trim();
  const line=first.charAt(0).toUpperCase()+first.slice(1).replace(/[.]+$/,"")+".";
  return{skills:found,terms,resumeLine:line,interviewStory:"Say what you said, \""+(sentences[0]||text)+"\" Then add what you did step by step and how it turned out.",engine:"offline"};
}
async function translate(text,source){
  const field=(state.profile&&state.profile.field)||"Not sure yet";
  if(sampleFn){
    try{
      const out=await sampleFn.json(
`You help a college student name the skills in their own words. Source type is "${source}". Their major is "${(state.profile&&state.profile.major)||"undeclared"}" and their target career area is "${field}".
Rules you must follow.
1. Never invent facts, numbers, outcomes, or job titles that are not in their words.
2. Pick 1 to 3 skills ONLY from this list: ${SKILLS.join(", ")}.
3. For each skill give an exact quote copied from their words that shows it (max 25 words).
4. resumeLine is one line in plain professional English built only from what they said. No numbers unless they said them. If they named a specific technique, tool, method, software, lab procedure or system, keep that exact term in the line.
4b. terms is a list of the specific techniques, tools, methods, software, lab procedures, systems or equipment they named, copied exactly, up to 4. Empty list if they named none. Never add one they did not say.
5. interviewStory is 3 to 4 sentences in first person, using their phrasing where possible, situation then action then result. If they did not say a result, end with "[add how it turned out]".
Return JSON only: {"skills":[{"name":"","quote":""}],"terms":[],"resumeLine":"","interviewStory":""}

Their words:
"""${text}"""`,{modelTier:"quick"});
      if(out&&Array.isArray(out.skills)){
        out.skills=out.skills.filter(s=>SKILLS.includes(s.name)).slice(0,3);
        out.terms=(Array.isArray(out.terms)?out.terms:[]).filter(t=>typeof t==="string"&&text.toLowerCase().includes(t.toLowerCase().split(" ")[0])).slice(0,4);
        if(out.terms.length&&!out.skills.some(s=>s.name==="Technical skills")&&out.skills.length<3)out.skills.push({name:"Technical skills",quote:out.terms.join(", ")});
        if(out.skills.length){out.engine="claude";return out;}
      }
    }catch(e){if(e&&e.code==="not_granted")sampleFn=null;}
  }
  return fallbackTranslate(text);
}

function skillCounts(){const c={};state.stories.forEach(s=>(s.skills||[]).forEach(k=>{c[k.name]=(c[k.name]||0)+1;}));return c;}
function tallyHTML(n){let h="",left=n;while(left>0){const g=Math.min(5,left);h+=`<span class="group ${g===5?"full":""}">${"<i></i>".repeat(Math.min(g,4))}</span>`;left-=g;}return `<span class="tallies" aria-label="${n} stories">${h}</span>`;}
function gaps(){const need=FIELD_NEEDS[(state.profile&&state.profile.field)||"Not sure yet"]||FIELD_NEEDS["Not sure yet"];const c=skillCounts();return need.filter(n=>!c[n]);}
function resourcesFor(skill){return RESOURCES.filter(r=>r.skills.includes(skill)&&eligible(r));}
function storiesFor(skill){return state.stories.filter(s=>(s.skills||[]).some(k=>k.name===skill));}
function resCard(r,skill){
  const went=state.visits[r.id];
  return `<div class="res">
    <h3>${esc(r.name)}</h3>
    <div class="who">${esc(r.org)}. For ${esc(r.who)}.</div>
    <p class="small">${esc(r.what)}</p>
    ${skill?`<p class="small muted">Suggested because your stories don't show ${esc(skill.toLowerCase())} yet.</p>`:""}
    <div class="row">
      ${r.url?`<a href="${r.url}" target="_blank" rel="noopener" class="btn ghost small" style="padding:8px 14px;text-decoration:none">Open page</a>`:`<span class="small muted">Search ${esc(r.org)} on asu.edu</span>`}
      <button class="btn ${went?"ghost":"gold"} small" style="padding:8px 14px" data-visit="${r.id}">${went?"Went, thanks":"I went"}</button>
    </div>
  </div>`;
}

// ---------- views
const V={};
V.welcome=()=>`
  <div class="top"><div class="brand"><span class="tallyLogo"><i></i><i></i><i></i><i></i></span>Counts</div></div>
  <h1>What you already do counts.</h1>
  <p class="muted">Your classes, your job, your life. Counts asks one short question right after it happens, keeps your answer in your own words, and shows you the skills inside it. When a skill is missing for your major, it points you to the ASU resource that builds it.</p>
  <div class="chips" aria-label="What counts"><span class="skillTag">Learning</span><span class="skillTag">Work</span><span class="skillTag">Life</span></div>
  <div class="panel">
    <label for="pc">Class code from your intro class</label><input id="pc" placeholder="e.g. ASU101-FALL" value="ASU101-FALL">
    <p class="small muted">Any first year intro course, in person or online. Your instructor only ever sees class totals, never your stories.</p>
    <label for="pn">First name</label><input id="pn" autocomplete="given-name" placeholder="e.g. Sam">
    <label>Do you work right now?</label>
    <div class="seg" id="pw">
      <button class="btn ghost" data-work="none" aria-pressed="false">Not yet</button>
      <button class="btn ghost" data-work="campus" aria-pressed="false">ASU job</button>
      <button class="btn ghost" data-work="off" aria-pressed="false">Off campus job</button>
    </div>
    <div id="jobWrap" hidden><label for="pj">Where?</label><input id="pj" placeholder="e.g. Library front desk, Target, family restaurant"></div>
    <label for="pm">Your major</label><input id="pm" placeholder="e.g. Biomedical Engineering, or undecided">
    <label for="pf">Closest career area</label>
    <select id="pf">${Object.keys(FIELD_NEEDS).map(f=>`<option>${f}</option>`).join("")}</select>
    <div class="toggle"><input type="checkbox" id="share" checked><label for="share" style="margin:0;font-weight:400">Add my skill counts to my class totals. Counts only, never my words.</label></div>

const TABS=[["home","Home"],["catch","Catch"],["bank","Bank"],["resources","ASU"],["apply","Deadline"]];
const PARENT={manager:"home",unpaid:"home",swap:"bank",insights:"home"};
function render(){
  document.getElementById("app").innerHTML=V[view]();
  document.querySelector(".tabs").style.display=state.profile?"":"none";
  const cur=PARENT[view]||view;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-go="${k}" ${cur===k?'aria-current="page"':""}>${l}</button>`).join("");
}
function go(v,mode){stopMic();if(v!==view&&v!=="swap"){tmp={};}if(v==="catch"){tmp.mode=mode||tmp.mode||"class";if(mode)tmp.prompt=null;}view=v;render();window.scrollTo(0,0);}

let rec=null;
function stopMic(){if(rec){try{rec.stop();}catch(e){}rec=null;}tmp.listening=false;}
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  if(tmp.listening){stopMic();render();return;}
  const base=(document.getElementById("said")||{}).value||"";
  try{
    rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";
    rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;tmp.text=(base?base+" ":"")+t;const el=document.getElementById("said");if(el)el.value=tmp.text;};
    rec.onerror=()=>{stopMic();render();const el=document.getElementById("said");if(el){el.placeholder="Voice was blocked here. Type what happened instead.";el.focus();}};
    rec.onend=()=>{if(tmp.listening){tmp.listening=false;render();}};
    rec.start();tmp.listening=true;render();
  }catch(e){stopMic();render();}
}

document.addEventListener("input",e=>{
  if(e.target.id==="said")tmp.text=e.target.value;
  if(e.target.id==="post")tmp.post=e.target.value;
  if(e.target.dataset.u)tmp.unpaid[e.target.dataset.u]=e.target.value;
});
document.addEventListener("change",e=>{if(e.target.id==="flt"){tmp.filter=e.target.value;render();}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.catch){go("catch",b.dataset.catch);return;}
  if(b.dataset.home){tmp.homeMode=b.dataset.home;tmp.push=false;render();return;}
  if(b.dataset.mode){tmp.mode=b.dataset.mode;tmp.prompt=null;tmp.result=null;render();return;}
  if(b.dataset.work){tmp.work=b.dataset.work;document.querySelectorAll("#pw button").forEach(x=>x.setAttribute("aria-pressed",x===b));document.getElementById("jobWrap").hidden=tmp.work==="none";return;}
  if(b.dataset.visit){state.visits[b.dataset.visit]=Date.now();save();render();return;}
  if(b.dataset.del){state.stories=state.stories.filter(s=>s.id!==b.dataset.del);save();render();return;}
  if(b.dataset.swap){tmp={swapId:b.dataset.swap};view="swap";render();window.scrollTo(0,0);return;}
  if(b.dataset.chip){const k=b.dataset.chip,a=tmp.swapSkills;const i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);b.setAttribute("aria-pressed",i<0);return;}
  if(b.dataset.yn){const [id,v]=b.dataset.yn.split(":");if(v==="y"){if(tmp.unpaid[id]===undefined)tmp.unpaid[id]="";tmp["n_"+id]=false;}else{delete tmp.unpaid[id];tmp["n_"+id]=true;}render();return;}
  const act=b.dataset.act;
  if(act==="start"){
    const name=document.getElementById("pn").value.trim(),job=document.getElementById("pj").value.trim();
    if(!name){alert("Add your first name to start.");return;}
    if(!tmp.work){alert("Pick whether you work right now.");return;}
    if(tmp.work!=="none"&&!job){alert("Add where you work.");return;}
    state.profile={name,cls:document.getElementById("pc").value.trim()||"Intro class",work:tmp.work,job:tmp.work==="none"?"":job,major:document.getElementById("pm").value.trim(),field:document.getElementById("pf").value,share:document.getElementById("share").checked};
    save();go("home");
  }
  if(act==="demo"){seedDemo();go("home");}
  if(act==="push"){tmp.push=!tmp.push;render();}
  if(act==="gotjob"){const j=prompt("Where do you work?");if(j&&j.trim()){const campus=confirm("Is it an ASU job? OK for yes, Cancel for off campus.");state.profile.work=campus?"campus":"off";state.profile.job=j.trim();save();render();}}
  if(act==="mic")toggleMic();
  if(act==="newprompt"){const L=tmp.mode==="class"?CLASS_PROMPTS:PROMPTS;const i=L.indexOf(tmp.prompt);tmp.prompt=L[(i+1)%L.length];tmp.result=null;render();}
  if(act==="translate"){
    stopMic();const text=(tmp.text||"").trim();
    if(text.length<12){alert("Say or type a little more about what happened, at least a sentence.");return;}
    tmp.busy=true;tmp.result=null;render();tmp.result=await translate(text,tmp.mode==="class"?"class, lab, or project":"work shift");tmp.busy=false;render();
  }
  if(act==="keep"){addStory(tmp.mode==="class"?"class":"shift",tmp.text,tmp.result);go("home");}
  if(act==="discard"){tmp={};render();}
  if(act==="mview"){tmp.mview=true;render();}
  if(act==="mback"){tmp.mview=false;render();}
  if(act==="msend"){
    const who=document.getElementById("mname").value.trim(),line=document.getElementById("mline").value.trim();
    if(!who||line.length<10){alert("Add a name and one full sentence.");return;}
    tmp.busy=true;render();const r=await translate(line,"manager endorsement");addStory("manager",line,r,who);go("bank");
  }
  if(act==="usend"){
    const entries=Object.entries(tmp.unpaid||{}).filter(([k,v])=>v.trim().length>=8);
    if(!entries.length){alert("Say yes to at least one and describe it in a sentence.");return;}
    tmp.busy=true;render();let out="";
    for(const [id,v] of entries){const r=await translate(v,"unpaid work: "+id);addStory("unpaid",v,r);
      out+=`<div class="story"><div class="said">${esc(v)}</div><div style="margin-top:8px">${r.skills.map(s=>`<span class="skillTag">${esc(s.name)}</span>`).join("")}</div><p class="resumeLine small">${esc(r.resumeLine)}</p></div>`;}
    tmp.busy=false;tmp.unpaid={};tmp.uresults=`<section class="panel"><h3>Counted</h3>${out}<button class="btn gold" data-go="bank">See my bank</button></section>`;render();
  }
  if(act==="swapsend"){
    const s=state.stories.find(x=>x.id===tmp.swapId);
    if(!tmp.swapSkills.length){alert("Pick at least one skill you heard.");return;}
    s.peer={skills:tmp.swapSkills.slice(),note:document.getElementById("pnote").value.trim()};save();go("bank");
  }
  if(act==="nextq"){tmp.qi=((tmp.qi||0)+1)%QUESTIONS.length;render();}
  if(act==="match"){
    const post=(tmp.post||"").trim();if(post.length<30){alert("Paste more of the posting, at least a few lines.");return;}
    tmp.busy=true;tmp.match=null;render();tmp.match=await matchStories(post);tmp.busy=false;render();
  }
});

function addStory(source,original,r,from){state.stories.push({id:uid(),date:Date.now(),source,from:from||null,original,skills:r.skills,terms:r.terms||[],resumeLine:r.resumeLine,interviewStory:r.interviewStory});save();}

async function matchStories(post){
  const bank=state.stories.map((s,i)=>({i,original:s.original,skills:(s.skills||[]).map(k=>k.name)}));
  if(sampleFn){
    try{
      const out=await sampleFn.json(
`A student is applying to this posting. Choose up to 3 stories from their bank that best fit it.
Rules. Never invent facts or numbers. Use only what is in the stories. Keep their phrasing where possible.
Return JSON only: {"picks":[{"i":0,"why":"one sentence on why it fits the posting","bullet":"one resume bullet from their words only"}],"missing":"one sentence naming a requirement in the posting none of the stories show, or empty string"}

Posting:
"""${post.slice(0,4000)}"""

Bank:
${JSON.stringify(bank).slice(0,8000)}`,{modelTier:"default"});
      if(out&&Array.isArray(out.picks)&&out.picks.length){
        return `<h3>Your best stories for this</h3>`+out.picks.filter(p=>state.stories[p.i]).map(p=>{const s=state.stories[p.i];return `<div class="story"><div class="said">${esc(s.original)}</div><p class="small muted" style="margin-top:8px">${esc(p.why)}</p><p class="resumeLine">${esc(p.bullet)}</p></div>`;}).join("")+(out.missing?`<p class="notice">${esc(out.missing)}</p>`:"")+`<p class="small muted">Picked by Claude from your own stories.</p>`;
      }
    }catch(e){}
  }
  const words=post.toLowerCase();
  const scored=state.stories.map(s=>({s,score:(s.skills||[]).reduce((a,k)=>a+(words.includes(k.name.toLowerCase().split(" ")[0])?2:0),0)})).sort((a,b)=>b.score-a.score).slice(0,3);
  return `<h3>Your best stories for this</h3>`+scored.map(({s})=>`<div class="story"><div class="said">${esc(s.original)}</div><div style="margin-top:8px">${(s.skills||[]).map(k=>`<span class="skillTag">${esc(k.name)}</span>`).join("")}</div><p class="resumeLine small">${esc(s.resumeLine)}</p></div>`).join("")+`<p class="small muted">Offline match by skill keywords.</p>`;
}

  const d=n=>Date.now()-n*86400000;
  state.profile={name:"Sam",cls:"ASU101-FALL",work:"campus",job:"Campus library front desk",major:"Business Administration",field:"Business",share:true};
  state.visits={};
  state.stories=[
    {id:uid(),date:d(50),source:"class",original:"Our group project for my marketing class fell apart because nobody agreed on the survey. I set up a quick vote, split the questions between us, and we turned it in on time.",skills:[{name:"Leadership",quote:"I set up a quick vote"},{name:"Teamwork",quote:"split the questions between us"},{name:"Conflict resolution",quote:"nobody agreed on the survey"}],resumeLine:"Organized a stalled class project team by running a vote and dividing the survey work, meeting the deadline.",interviewStory:"In my marketing class our group couldn't agree on the survey. I set up a quick vote and split the questions between us. We turned it in on time."},
    {id:uid(),date:d(9),source:"class",original:"I had to redo my whole spreadsheet for accounting because the formulas broke. I figured out which cells were wrong and explained the fix to two people in my section.",skills:[{name:"Problem solving",quote:"I figured out which cells were wrong"},{name:"Technical skills",quote:"redo my whole spreadsheet"},{name:"Communication",quote:"explained the fix to two people in my section"}],terms:["spreadsheet formulas"],resumeLine:"Rebuilt a broken accounting spreadsheet and explained the fix to classmates.",interviewStory:"My accounting spreadsheet broke and I had to redo it. I tracked down which cells were wrong and fixed them, then showed two classmates the fix. [add how it turned out]"},
    {id:uid(),date:d(60),source:"unpaid",original:"I translate for my mom at the doctor and fill out all the insurance forms for my family.",skills:[{name:"Communication",quote:"I translate for my mom at the doctor"},{name:"Responsibility",quote:"fill out all the insurance forms for my family"}],resumeLine:"Serve as family interpreter in medical settings and manage household insurance paperwork.",interviewStory:"I translate for my mom at doctor visits and I handle our family's insurance forms. [add how it turned out]"},
    {id:uid(),date:d(40),source:"shift",original:"A student was really upset because his hold had expired and he needed the book for an exam tomorrow. I calmed him down, checked the other campus, and got it transferred for the morning.",skills:[{name:"Conflict resolution",quote:"I calmed him down"},{name:"Problem solving",quote:"checked the other campus, and got it transferred for the morning"}],resumeLine:"Resolved an upset patron's expired hold by locating the item at another campus and arranging a next morning transfer.",interviewStory:"A student came to the desk upset because his hold expired before an exam. I calmed him down and checked the other campus. I got the book transferred for the morning so he had it in time.",peer:{skills:["Conflict resolution","Customer service"],note:"You stayed way calmer than I would have."}},
    {id:uid(),date:d(32),source:"shift",original:"Two people called out so it was just me and one new person during finals week. I showed her how to do checkouts while I handled the line.",skills:[{name:"Training others",quote:"I showed her how to do checkouts"},{name:"Adaptability",quote:"Two people called out"},{name:"Time management",quote:"while I handled the line"}],resumeLine:"Trained a new coworker on checkouts while managing the service line during a short staffed finals week shift.",interviewStory:"During finals week two people called out, leaving me with one new hire. I showed her checkouts while I kept the line moving. [add how it turned out]"},
    {id:uid(),date:d(21),source:"manager",from:"Dana, desk supervisor",original:"Sam is the person I trust to close alone. The drawer is always right and nothing gets left undone.",skills:[{name:"Responsibility",quote:"the person I trust to close alone"},{name:"Attention to detail",quote:"The drawer is always right"}],resumeLine:"Trusted by supervisor to close the desk independently with accurate cash drawer reconciliation.",interviewStory:"My supervisor trusts me to close alone. I make sure the drawer is right and nothing is left undone."},
    {id:uid(),date:d(4),source:"shift",original:"The printer system went down and a line formed. I figured out it was the queue, restarted it, and told everyone waiting what was happening.",skills:[{name:"Problem solving",quote:"I figured out it was the queue, restarted it"},{name:"Communication",quote:"told everyone waiting what was happening"},{name:"Technical skills",quote:"restarted it"}],terms:["print queue"],resumeLine:"Diagnosed and restarted a failed print queue while keeping waiting patrons informed.",interviewStory:"The printer system went down and a line formed. I figured out it was the queue and restarted it, and I told everyone waiting what was going on. [add how it turned out]"}
  ];
  save();
}
render();
})();
